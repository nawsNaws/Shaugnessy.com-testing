<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hobby Gallery</title>
    <link rel="stylesheet" href="shaugnessy.css" />
</head>
<body>
    <nav class="site-nav" aria-label="Main navigation">
        <a class="site-mark" href="index.html">Shaugnessy</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="#gallery">Gallery</a></li>
        </ul>
    </nav>

    <main id="gallery" class="gallery-page">
        <div class="section-heading">
            <h2>Hobby Gallery</h2>
            <p>Some of the things I enjoy doing and exploring.</p>
        </div>

        <div class="portfolio-grid">
            <article class="portfolio-card">
                <img src="me1.jpg" alt="Tennis and badminton hobbies">
                <div class="portfolio-info">
                    <h3>Active Days</h3>
                    <p>Sports, movement, and energy</p>
                </div>
            </article>
            <article class="portfolio-card">
                <img src="me2.jpg" alt="Creative hobby moments">
                <div class="portfolio-info">
                    <h3>Creative Time</h3>
                    <p>Drawing and making things</p>
                </div>
            </article>
            <article class="portfolio-card">
                <img src="me3.jpg" alt="More personal hobby moments">
                <div class="portfolio-info">
                    <h3>Personal Interests</h3>
                    <p>Exploring what I love</p>
                </div>
            </article>
        </div>
    </main>
    <footer class="site-footer">
        <a href="index.html">← Back to collections</a>
        <span>Hobbies · Shaugnessy</span>
